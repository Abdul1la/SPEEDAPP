<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Speed Alert Admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <section id="login" class="login" hidden>
      <form id="login-form" class="card login-card">
        <h1>Speed Alert Admin</h1>
        <p class="muted">Sign in with a moderator or admin account.</p>
        <label>Email <input name="email" type="email" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </section>

    <section id="app" hidden>
      <header class="top">
        <strong>Speed Alert Admin</strong>
        <nav id="tabs" aria-label="Sections">
          <button data-tab="overview">Overview</button>
          <button data-tab="reports">Reports <span id="open-count" class="pill" hidden></span></button>
          <button data-tab="points">Points</button>
          <button data-tab="users">Users</button>
          <button data-tab="activity">Activity</button>
        </nav>
        <span class="me"><span id="me"></span> <button id="logout" class="link">Sign out</button></span>
      </header>
      <main id="view" aria-live="polite"></main>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="admin.js"></script>
  </body>
</html>
